[workspace]
resolver = "3"
members = ["src/diff", "src/multidoc", "src/snippet", "src/main", "src/line", "src/layout"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Internal crates
everdiff-diff = { path = "src/diff" }
everdiff-layout = { path = "src/layout" }
everdiff-multidoc = { path = "src/multidoc" }
everdiff-snippet = { path = "src/snippet" }
everdiff-line = { path = "src/line" }

# External dependencies
ansi-width = "0.1.0"
anyhow = "1.0.94"
bpaf = "0.9"
camino = "1.1.9"
fern = { version = "0.7", default-features = false }
hashlink = "0.12"
log = "0.4"
nom = "8"
owo-colors = "4.1.0"
# saphyr = { git = "https://github.com/saphyr-rs/saphyr", version = "0.0.6" }
saphyr = { version = "0.0.11" }
similar = { version = "3.1", features = ["inline"] }
terminal_size = { version = "0.4.3" }
unicode-width = "0.2"
tracing = "0.1"

# Dev dependencies
indoc = "2.0.5"
pretty_assertions = "1.4.1"
expect-test = "1.5.0"
test-log = "0.2.18"

[profile.release]
opt-level = "z"       # optimize for size ("s" is a lighter touch)
lto = true            # link-time optimization — big win
codegen-units = 1     # less parallelism, better optimization + dedup
panic = "abort"       # strips unwinding machinery — often saves hundreds of KB
strip = true          # strip symbols from final binary
